[workspace]
resolver = "2"
members = [
    "crates/nemclass-core",
    "crates/nemclass-model",
    "crates/nemclass-script",
    "crates/nemclass-ui",
    "crates/nemclass-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# External
iced-x86 = { version = "1.21.0", features = ["default"] }
bitflags = "2.4.0"
obfstr = "0.4.3"
libc = "0.2.189"
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
env_logger = "0.11"
serde_json = "1"
# rustyscript wraps deno_core/v8 (the `scripting` feature of nemclass-script).
# Heavy build — an optional dep, pinned. Enabled only via `--features scripting`.
#
# Pinned to 0.11.0 (deno_ast 0.43.3 / swc_config 0.1.15) DELIBERATELY: rustyscript
# 0.12.x pulls deno_ast 0.49 -> swc_config =3.0.0, whose `use serde::__private::de`
# no longer resolves against serde >= 1.0.220 (serde now mangles the private module
# to `__private<patch>`), and the rest of that same deno tree hard-requires
# serde >= 1.0.221 (serde_core / serde_bytes 0.11.19 / uuid) — mutually unsatisfiable.
# 0.11.0 predates the broken swc_config and builds against current serde.
rustyscript = "=0.11.0"
# UI
egui = "0.35.0"
egui_extras = { version = "0.35.0", features = ["default"] }
eframe = { version = "0.35.0", features = ["default"] }

# Internal
nemclass-core = { path = "crates/nemclass-core" }
nemclass-model = { path = "crates/nemclass-model" }
nemclass-script = { path = "crates/nemclass-script" }
nemclass-ui = { path = "crates/nemclass-ui" }
